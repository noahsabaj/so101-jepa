# SO-101 sim: vision-only LeWM plus endpoint inverse dynamics (variant E of the blind-latent fix,
# 2026-10-07; EP-IDM from arXiv 2610.07540). From z_t and z_t+10 alone, an MLP reconstructs the 10
# actions between them (2 s), so the latent must keep what those actions changed: the arm, and the
# cube when the arm moves it. Clips grow from 5 to 11 frames. Everything else is so101_lewm_vis.
defaults:
- so101_lewm_vis
- _self_
output_model_name: so101_lewm_vis_epidm
data:
  dataset:
    level1:
      num_steps: 11
level1:
  ep_idm_coeff: 10
  ep_idm:
    hidden_dim: 256
    horizon: 10
