# SO-JEPA v29 (MODELS.md): SO-JEPA v6 with Prodigy + ScheduleFree (A23): no learning rate (Prodigy sets
# the step size) and no schedule or warmup (schedule-free averaging; ScheduleFreeModes switches its modes).
defaults:
- sojepa-v6
- _self_
output_model_name: sojepa-v29
optimizer:
  type: prodigyplus.prodigy_plus_schedulefree.ProdigyPlusScheduleFree
  lr: 1.0
  weight_decay: 1.0e-04
  schedule_free: true
level1:
  lr: 1.0
  encoder:
    pixel_encoder:
      encoder: {gradient_checkpointing: false}
