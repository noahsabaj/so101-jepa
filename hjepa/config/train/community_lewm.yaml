# Community SO-100/SO-101 data (real robots, 1 scene view at 64x64, 5 Hz): flat LeWM.
# Same model as the sim LeWM; only the data changes. Validation uses the held-out setups.
defaults:
- base/so101
- _self_
output_model_name: community_lewm
env: community
num_levels: 1
data:
  dataset:
    name: community_train
    val_name: community_test
trainer:
  max_epochs: 5
