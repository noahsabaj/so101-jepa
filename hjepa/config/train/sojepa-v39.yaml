# Historical: it diverged, and the fit code was removed afterwards; it runs only with fork f1eee9a.
# SO-JEPA v39 (MODELS.md): SO-JEPA v38 with a fitted loss floor (fstar: fit); v38: ScheduleFree+ (Defazio, arXiv 2605.19095; h_jepa/sfplus.py, a port
# of Meta's reference code): Polyak step size (no learning rate) and Schedule-Free averaging (no schedule).
# Paper settings for a short run: 400 warmup steps, c_warmup 800, r 0, sf_beta1 0.9, AdamC weight decay 5.
defaults:
- sojepa-v6
- _self_
output_model_name: sojepa-v39
optimizer:
  type: sfplus.AdamCScheduleFreePlus
  lr: 1.0
  betas: [0.9, 0.95]
  sf_beta1: 0.9
  weight_decay: 5.0
  r: 0.0
  polyak_beta: 0.9
  c_warmup: 800
  schedule_free: true
  warmup_steps: 400
  fstar: fit
level1:
  lr: 1.0
  encoder:
    pixel_encoder:
      encoder: {gradient_checkpointing: false}
