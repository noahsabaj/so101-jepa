# SO-JEPA v53 (PLAN.md A25): data scaling of LeWAM. v47b's recipe (warm start from the authors' Cube checkpoint,
# 64 px views upsampled to 96) at a fixed compute budget, 8 epochs of the full train set, trained on a fraction F of
# the train episodes (repeated to the same steps), F = 1/8, 1/4, 1/2, 1 (sojepa-v53-f12 ... -f100). Val: a held-out
# 10% of the episodes for every F (LEWAM_DATA_FRACTION in hjepa/lewam_common.py); then hjepa/lewam_check.py on
# the val episodes. How fast does the head improve with more data? Run: sh hjepa/lewam_scaling.sh
defaults:
  - sojepa-v47b
  - _self_

train:
  epochs: 8
  warmup_epochs: 1
