# SO-101: so101_flat_cem with the model under fp16 autocast and a compiled predictor (hjepa/bench_plan.py:
# 3x faster than fp32 on an MI355X; plans within 0.008 rad of fp32). Eval configs load without defaults.
policy: ???
seed: 1234
solver:
  _target_: stable_worldmodel.solver.CEMSolver
  n_steps: 30
  num_samples: 300
  topk: 30
  var_scale: 1.0
  batch_size: 1
  action_clip_sigma: 2.0
  device: cuda
  seed: ${seed}
plan_config:
  horizon: 5
  receding_horizon: 2
  cost_last_n: 1
precision: fp16
compile: true
