# SO-101: 2-level hierarchical planning with H-JEPA. Level 2 (1 s steps, 8-d macro-actions)
# plans 4 s ahead; its first predicted state is the subgoal of level 1 (0.2 s steps, 1 s ahead).
policy: ???
seed: 1234
solver:
  _target_: hierarchical_solver.HierarchicalSolver
  solvers:
    level1:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 90
      min_its: 30
      early_stop_patience: 5
      early_stop_rel_delta: 0.01
      batch_size: 1
      var_scale: 1.5
      num_samples: 32
      action_noise: 0
      action_clip_sigma: 2.0
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.05
        weight_decay: 0.01
    level2:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 90
      min_its: 30
      early_stop_patience: 5
      early_stop_rel_delta: 0.01
      batch_size: 1
      var_scale: 1.5
      num_samples: 16
      action_noise: 0
      action_clip_sigma: 2.0
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.3
        weight_decay: 0.01
hierarchical_plan_config:
  receding_horizon: 2
  level1:
    horizon: 5
    pre_decay_horizon: 5
    cost_last_n: 1
  level2:
    horizon: 4
    action_dim: 8
    num_subgoals: 1
    cost_last_n: 1
    horizon_one_goal_cost_space: upper
