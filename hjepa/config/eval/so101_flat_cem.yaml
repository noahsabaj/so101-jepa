# SO-101: flat planning with the cross-entropy method, the planner of LeWM and LpWM (settings of
# LpWM's cem.yaml: 300 samples, top 30, 30 iterations). Horizon, replanning and the action bounds
# are those of so101_flat, so the two planners differ only in the search.
policy: ???
seed: 1234
solver:
  _target_: stable_worldmodel.solver.CEMSolver
  n_steps: 30
  num_samples: 300
  topk: 30
  var_scale: 1.0
  batch_size: 1
  action_clip_sigma: 2.0
  device: cuda
  seed: ${seed}
plan_config:
  horizon: 5
  receding_horizon: 2
  cost_last_n: 1
