[project]
name = "so101-jepa"
version = "0.1.0"
description = "An SO-101 arm learns to assemble an SO-101 arm with a hierarchical JEPA world model"
requires-python = ">=3.11,<3.12"
dependencies = [
    "h-jepa",                     # third_party/H-JEPA: stable_worldmodel (+ h_jepa scripts run from source)
    "torch==2.11.0",              # the newest torch with torchaudio, CUDA 12.8 and ROCm 7.2 wheels
    "torchvision==0.26.0",
    "torchaudio==2.11.0",         # pulled in by h-jepa
    "transformers>=4.50.0",
    "stable-pretraining==0.1.7",  # H-JEPA training needs exactly 0.1.7
    "datasets>=4",
    "lightning>=2.5",
    "torchmetrics",
    "hydra-core",
    "scikit-learn",
    "matplotlib",
    "mujoco==3.14.0",             # pinned as in H-JEPA: versions change contact outcomes
    "gymnasium==1.2.3",
    "h5py",
    "hdf5plugin",
    "numpy",
    "pillow",
    "trimesh",
    "coacd",                      # convex decomposition of CAD parts for contact
    "prodigyopt",                 # learning-rate-free optimizer (PLAN.md A23)
    "prodigy-plus-schedule-free", # learning-rate-free and schedule-free optimizer (A23)
]

# The GPU build of torch (GPU.md): one group per GPU vendor, the same torch version in each.
# NVIDIA (CUDA 12.8) is the default: plain `uv run`. AMD (ROCm 7.2, Linux only): scripts/uvr runs
# `uv run --no-group cuda --group rocm` when the computer has an AMD GPU and no NVIDIA GPU.
[dependency-groups]
cuda = ["torch==2.11.0", "torchvision==0.26.0", "torchaudio==2.11.0"]
rocm = [
    "torch==2.11.0", "torchvision==0.26.0", "torchaudio==2.11.0",
    "triton-rocm==3.6.0; sys_platform == 'linux'",  # torch's compiler; on the ROCm index only
]

[tool.uv]
package = false
default-groups = ["cuda"]
conflicts = [[{ group = "cuda" }, { group = "rocm" }]]

[tool.uv.sources]
h-jepa = { path = "third_party/H-JEPA", editable = true }
torch = [
    { index = "pytorch-cu128", group = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-rocm72", group = "rocm", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", group = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-rocm72", group = "rocm", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", group = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-rocm72", group = "rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = [{ index = "pytorch-rocm72", group = "rocm", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
